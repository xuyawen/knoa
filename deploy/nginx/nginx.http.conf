# Knoa edge 反向代理 —— HTTP-only 模式（过渡期 / 纯 IP 访问 / 无域名）
#
# 由 docker-compose.prod-lean.yml 的 edge 服务挂载为 /etc/nginx/conf.d/default.conf。
# 适用：服务器只有公网 IP、暂无域名、过渡期临时对外访问。
# 生产（阿里云 + 绑定域名）后请改回 nginx.conf（HTTPS + 证书）。
#
# 职责：
#   - 80 -> 根路径反代到 frontend:80（SPA 静态资源）
#   - 80 -> /api/ 反代到 backend:8000（流式问答关闭代理缓冲）
# 说明：HTTP 模式下不启用 HSTS；传输未加密，仅适合过渡期。

# ---------- 限流 zone（http 上下文；本文件被 include 进 http{}）----------
limit_req_zone $binary_remote_addr zone=api_flood:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # 安全响应头（HTTP 下不启用 HSTS）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 文档上传上限（前端读成 base64 提交，偏大；与 backend 保持一致或更大）
    client_max_body_size 50m;

    # SPA 静态资源压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss;

    # 根路径 -> 前端 SPA（容器网络内 frontend:80）
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API + SSE 流式问答：必须关闭代理缓冲，否则回答会被攒批后一次性吐出
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 边缘洪水防护：超出 zone 配额的请求直接 429，不转发到 backend。
        # burst=40 nodelay 允许短突发立即放行，超出部分排队/拒绝。
        limit_req zone=api_flood burst=40 nodelay;
        limit_req_status 429;

        # SSE / 长连接关键开关
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 强制分块传输，避免任何上游层面的缓冲
        chunked_transfer_encoding on;
    }
}
